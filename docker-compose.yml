services:
  mysql:
    image: mysql:8.0
    container_name: smart_campus_mysql
    environment:
      MYSQL_DATABASE: smart_campus
      MYSQL_USER: user
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: rootpassword
    volumes:
      - smart_campus_mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: smart_campus_app
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/smart_campus?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USERNAME: user
      DB_PASSWORD: password
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  smart_campus_mysql_data:
